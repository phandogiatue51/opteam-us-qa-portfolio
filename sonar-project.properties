# Project Identification
sonar.projectKey=phandogiatue51_opteam-us-qa-portfolio
sonar.organization=phandogiatue51

# Paths to source code
sonar.sources=Backend/OpTeamUs/OpTeamUs,Frontend/src
sonar.tests=Backend/OpTeamUs/OpTeamUs.Tests,Frontend/tests

# Exclusions from static analysis (build artifacts, dependencies, generated code)
sonar.exclusions=**/bin/**,**/obj/**,**/dist/**,**/node_modules/**,Frontend/src/components/ui/**

# Exclude from test coverage calculations:
# - Frontend UI
# - Boilerplate entrypoint (Program.cs)
# - Auto-generated EF Core migrations
# - Plain DTOs & Models (no business logic)
# - Demo/Sandbox Controller
sonar.coverage.exclusions=Frontend/**,**/Program.cs,**/Migrations/**,**/DTOs/**,**/Models/**,**/Controllers/TestController.cs

# --- Backend C# Test Coverage ---
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# --- Frontend JavaScript/TypeScript Test Coverage ---
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
