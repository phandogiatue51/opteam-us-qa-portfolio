name: API Contract Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: OpenAPI Schema Linting (Spectral)
  # -------------------------------------------------------------
  spectral-lint:
    name: Lint OpenAPI Specification (Spectral)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Spectral Linter
        run: |
          npx @stoplight/spectral-cli lint Backend/swagger.json --ruleset tests/contract/.spectral.yaml

  # -------------------------------------------------------------
  # Job 2: Property-Based Dynamic Contract Testing (Schemathesis)
  # -------------------------------------------------------------
  schemathesis-contract-test:
    name: Dynamic Contract Testing (Schemathesis)
    runs-on: ubuntu-latest
    needs: spectral-lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opteamus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Schemathesis & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "schemathesis>=3.20.0" requests

      - name: Start ASP.NET Core Backend
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=opteamus;Username=postgres;Password=postgres"
          Jwt__Key: "DefaultInsecureDevSecretKeyMustBe32Bytes!"
          Jwt__Issuer: "TeamOps"
          Jwt__Audience: "TeamOpsUsers"
          ASPNETCORE_ENVIRONMENT: "Development"
        run: |
          dotnet run --project Backend/OpTeamUs/OpTeamUs/OpTeamUs.csproj --urls "http://127.0.0.1:8080" &
          
          # Wait up to 30 seconds for the backend to start and serve Swagger
          echo "Waiting for API to be ready..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8080/swagger/v1/swagger.json > /dev/null; do sleep 1; done'
          echo "API is ready!"

      - name: Run Schemathesis Contract Tests
        env:
          API_BASE_URL: "http://127.0.0.1:8080"
          TEST_USER_EMAIL: "contract_user@example.com"
          TEST_USER_PASSWORD: "Password123!"
        run: |
          st run http://127.0.0.1:8080/swagger/v1/swagger.json \
            --base-url http://127.0.0.1:8080 \
            --hooks tests/contract/schemathesis-hooks.py \
            --checks not_a_server_error,status_code_conformance,content_type_conformance \
            --hypothesis-max-examples 25 \
            --mode positive,negative \
            --report-junit schemathesis-report.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-contract-report
          path: schemathesis-report.xml
