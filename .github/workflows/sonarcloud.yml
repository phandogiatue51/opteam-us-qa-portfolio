name: SonarCloud Analysis & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for Sonar

      # 1. Setup .NET
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 2. Run Backend Tests with Coverage
      - name: Run Backend Tests
        run: |
          dotnet test Backend/OpTeamUs/OpTeamUs.sln --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # 3. Setup Node & Run Frontend Tests with Coverage
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Frontend Tests
        working-directory: ./Frontend
        run: |
          npm ci --ignore-scripts
          npx vitest run --coverage || true

      # 4. Run SonarCloud Scanner
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
            -Dsonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info